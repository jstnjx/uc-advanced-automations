services:
  uc-advanced-automations:
    build: .
    container_name: uc-advanced-automations
    restart: unless-stopped
    network_mode: host
    environment:
      UC_EXTERNAL: "true"
      UC_RUNTIME_MODE: external
      UC_DISABLE_MDNS_PUBLISH: "true"
      UC_AUTOMATIONS_DATA_DIR: /data
      UC_INTEGRATION_INTERFACE: 0.0.0.0
      UC_INTEGRATION_HTTP_PORT: 9090
      UC_AUTOMATIONS_WEB_HOST: 0.0.0.0
      UC_AUTOMATIONS_WEB_PORT: 8099
    volumes:
      - ./data:/data
