name: Build

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Cancel superseded branch and pull-request builds, including expensive ARM packages.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  PYINSTALLER_IMAGE: "docker.io/unfoldedcircle/r2-pyinstaller:3.11.13-0.7.0"
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt
      - run: make test
      - name: Build and smoke-test external container with installer contract
        run: |
          set -euo pipefail
          IMAGE="uc-advanced-automations:ci"
          NAME="uc-advanced-automations-ci"
          CONFIG_DIR="${RUNNER_TEMP}/uc-aa-config"
          INTEGRATION_PORT=19090
          WEB_PORT=9201
          rm -rf "$CONFIG_DIR"
          mkdir -p "$CONFIG_DIR"
          # Reproduce a stale/corrupt configuration left by an earlier failed install.
          printf '{invalid-json\n' > "$CONFIG_DIR/config.json"
          chmod 0777 "$CONFIG_DIR"

          docker build --tag "$IMAGE" .
          docker run --detach --name "$NAME" \
            --network host \
            --env UC_CONFIG_HOME=/config \
            --env UC_INTEGRATION_INTERFACE=0.0.0.0 \
            --env UC_INTEGRATION_HTTP_PORT="$INTEGRATION_PORT" \
            --env UC_DISABLE_MDNS_PUBLISH=true \
            --env UC_EXTERNAL=true \
            --env UC_RUNTIME_MODE=external \
            --volume "$CONFIG_DIR:/config" \
            "$IMAGE"
          cleanup() {
            docker logs "$NAME" || true
            docker rm --force "$NAME" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 40); do
            state="$(docker inspect --format '{{.State.Status}}' "$NAME")"
            if [ "$state" = "exited" ] || [ "$state" = "dead" ]; then
              echo "Container exited during installer-style startup" >&2
              exit 1
            fi
            if curl --fail --silent --show-error "http://127.0.0.1:${WEB_PORT}/api/health" > health.json \
              && (echo > "/dev/tcp/127.0.0.1/${INTEGRATION_PORT}") 2>/dev/null; then
              cat health.json
              python -c 'import json, pathlib; payload=json.loads(pathlib.Path("health.json").read_text()); assert payload["status"] == "ok", payload; assert payload["integration_api_ready"] is True, payload; assert payload["config_recovered"] is True, payload'
              test -n "$(find "$CONFIG_DIR" -maxdepth 1 -name 'config.invalid-*.json' -print -quit)"
              exit 0
            fi
            sleep 1
          done
          echo "Installer-style ports did not become ready" >&2
          exit 1


  remote-package:
    # Native ARM64 runner avoids the 15-20x QEMU emulation penalty.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v6
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="v$(jq -r .version driver.json)"
          test "$VERSION" = "${GITHUB_REF_NAME}"
      - name: Build Remote Two/3 package natively on ARM64
        run: |
          test "$(uname -m)" = "aarch64"
          docker run --rm --platform=linux/arm64/v8 \
            --user="$(id -u):$(id -g)" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            "${PYINSTALLER_IMAGE}" \
            bash -lc 'cd /workspace && python -m pip install -r requirements-build.txt && bash ./tools/build_remote.sh aarch64'
      - name: Verify ARM64 archive and checksum
        run: |
          ARCHIVE="$(find . -maxdepth 1 -name 'uc-intg-advanced-automations-*-aarch64.tar.gz' -print -quit)"
          test -n "$ARCHIVE"
          bash ./tools/verify_remote_archive.sh "$ARCHIVE"
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: remote-custom-install-aarch64
          path: |
            uc-intg-advanced-automations-*-aarch64.tar.gz
            uc-intg-advanced-automations-*-aarch64.tar.gz.sha256
          if-no-files-found: error

  container-image:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Resolve lowercase GHCR image name
        id: image
        shell: bash
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build and push multi-architecture image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  external-package:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: external-python-not-for-remote
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    needs: [remote-package, external-package, container-image]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        run: cd release-assets && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
