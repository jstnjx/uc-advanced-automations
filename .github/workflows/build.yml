name: Build

on:
  push:
    branches: [main]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.11"
  PYINSTALLER_IMAGE: "docker.io/unfoldedcircle/r2-pyinstaller:3.11.13-0.6.0"
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - run: python -m pip install -r requirements.txt
      - run: make test
      - name: Build and smoke-test external container
        run: |
          set -euo pipefail
          docker build --tag uc-advanced-automations:ci .
          docker run --detach --name uc-advanced-automations-ci \
            --publish 18099:8099 \
            --publish 19090:9090 \
            uc-advanced-automations:ci
          cleanup() {
            docker logs uc-advanced-automations-ci || true
            docker rm --force uc-advanced-automations-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if ! docker inspect uc-advanced-automations-ci >/dev/null 2>&1; then
              echo "Container disappeared during startup" >&2
              exit 1
            fi
            state="$(docker inspect --format '{{.State.Status}}' uc-advanced-automations-ci)"
            if [ "$state" = "exited" ] || [ "$state" = "dead" ]; then
              echo "Container exited during startup" >&2
              exit 1
            fi
            if curl --fail --silent --show-error http://127.0.0.1:18099/api/health > health.json; then
              cat health.json
              exit 0
            fi
            sleep 1
          done
          echo "Health endpoint did not become ready" >&2
          exit 1

  remote-package:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v6
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="v$(jq -r .version driver.json)"
          test "$VERSION" = "${GITHUB_REF_NAME}"
      - name: Enable ARM64 emulation
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-arm binfmt-support qemu-user-static
          docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
      - name: Build Remote Two/3 package
        run: |
          docker run --rm --platform=linux/arm64/v8 \
            --user="$(id -u):$(id -g)" \
            -v "${GITHUB_WORKSPACE}:/workspace" \
            "${PYINSTALLER_IMAGE}" \
            bash -lc 'cd /workspace && python -m pip install -r requirements-build.txt && bash ./tools/build_remote.sh aarch64'
      - name: Verify ARM64 archive and checksum
        run: |
          ARCHIVE="$(find . -maxdepth 1 -name 'uc-intg-advanced-automations-*-aarch64.tar.gz' -print -quit)"
          test -n "$ARCHIVE"
          bash ./tools/verify_remote_archive.sh "$ARCHIVE"
          sha256sum "$ARCHIVE" > "${ARCHIVE}.sha256"
      - uses: actions/upload-artifact@v7
        with:
          name: remote-custom-install-aarch64
          path: |
            uc-intg-advanced-automations-*-aarch64.tar.gz
            uc-intg-advanced-automations-*-aarch64.tar.gz.sha256
          if-no-files-found: error

  container-image:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    needs: test
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Resolve lowercase GHCR image name
        id: image
        shell: bash
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
      - name: Build and push multi-architecture image
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  external-package:
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: python -m pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: external-python-not-for-remote
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    needs: [remote-package, external-package, container-image]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true
      - name: Create checksums
        run: cd release-assets && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
