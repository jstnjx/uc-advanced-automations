name: Release v2.0.0 header pass

on:
  push:
    branches:
      - release/v2.0.0

permissions:
  contents: write

jobs:
  stamp:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Add v2.0.0 headers
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import json
          import subprocess

          HEADER = "Advanced Automations v2.0.0"
          SELF = Path(".github/workflows/_release-v2-header.yml")

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          tracked = [Path(p) for p in tracked if p and Path(p) != SELF]

          hash_names = {"Dockerfile", "Makefile", ".gitignore"}
          hash_exts = {".py", ".sh", ".yml", ".yaml", ".toml", ".txt", ".service", ".ini", ".cfg", ".conf"}
          block_exts = {".js", ".css"}
          xml_exts = {".md", ".html", ".htm", ".xml", ".svg"}

          changed = []
          skipped_binary = []
          json_native = []

          def insert_after_shebang(text: str, line: str) -> str:
              if HEADER in text[:300]:
                  return text
              if text.startswith("#!"):
                  first, sep, rest = text.partition("\n")
                  return first + "\n" + line + "\n" + rest
              return line + "\n" + text

          for path in tracked:
              data = path.read_bytes()
              if b"\0" in data:
                  skipped_binary.append(str(path))
                  continue
              try:
                  text = data.decode("utf-8")
              except UnicodeDecodeError:
                  skipped_binary.append(str(path))
                  continue

              if path.suffix.lower() == ".json":
                  payload = json.loads(text)
                  # JSON has no legal comment syntax. Keep strict JSON valid and use
                  # its native version metadata where the format already defines it.
                  if isinstance(payload, dict) and "version" in payload:
                      if str(payload["version"]).lstrip("v") != "2.0.0":
                          payload["version"] = "2.0.0"
                          new_text = json.dumps(payload, indent=2, ensure_ascii=False) + "\n"
                          path.write_text(new_text, encoding="utf-8")
                          changed.append(str(path))
                      json_native.append(str(path))
                  continue

              if HEADER in text[:300]:
                  continue

              suffix = path.suffix.lower()
              if path.name in hash_names or suffix in hash_exts:
                  new_text = insert_after_shebang(text, f"# {HEADER}")
              elif suffix in block_exts:
                  new_text = f"/* {HEADER} */\n" + text
              elif suffix in xml_exts:
                  new_text = f"<!-- {HEADER} -->\n" + text
              elif path.name == "LICENSE":
                  new_text = f"{HEADER}\n\n" + text
              else:
                  # Only touch text files with a known safe comment/header form.
                  continue

              if new_text != text:
                  path.write_text(new_text, encoding="utf-8")
                  changed.append(str(path))

          print(f"Stamped {len(changed)} files")
          if changed:
              print("\n".join(changed))
          print(f"JSON files using native version metadata: {len(json_native)}")
          if skipped_binary:
              print("Binary/non-UTF8 assets left byte-identical:")
              print("\n".join(skipped_binary))
          PY

          # This workflow is a one-shot branch helper and must not ship in the release.
          rm -f .github/workflows/_release-v2-header.yml

      - name: Validate stamped repository
        shell: bash
        run: |
          python -m compileall -q src tests tools driver.py
          python <<'PY'
          from pathlib import Path
          import json
          for path in Path('.').rglob('*.json'):
              if '.git' not in path.parts:
                  json.loads(path.read_text(encoding='utf-8'))
          PY
          git diff --check

      - name: Commit release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "release v2.0.0"
          git push origin HEAD:release/v2.0.0
